<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GIP Challenges">
  <!--
    The favicon. A rounded square in the accent colour with "GIP" on it.

    It is an SVG rather than a PNG so it stays sharp at every size a browser
    asks for, and it is tiny — a favicon is the first thing a visitor sees
    in their tab, not something that needs to carry detail.
  -->
  <rect width="64" height="64" rx="14" fill="#a3e635" />
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="0.5"
    fill="#101116"
  >GIP</text>
</svg>
